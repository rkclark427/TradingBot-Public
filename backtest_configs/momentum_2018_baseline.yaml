# Baseline MomentumContinuation backtest — 2018-01-01 to latest cached date.
#
# Usage:
#   bot-ctl backtest refresh-data --all          # populate the price cache
#   bot-ctl backtest run backtest_configs/momentum_2018_baseline.yaml
#
# Run this configuration exactly once on out-of-sample data before any
# parameter tuning. See docs/BacktestHarness_Specification_Phase2_v1.0.md §8.2.

strategy:
  class: MomentumContinuation
  parameters:
    lookback_days: 20
    hard_stop_pct: 0.04
    trailing_stop_pct: 0.05
    time_stop_days: 10
    risk_per_trade_pct: 0.01
    max_position_pct: 0.25
    max_concurrent_positions: 5
    max_total_deployment_pct: 1.00
    drawdown_circuit_breaker_pct: 0.15

benchmarks:
  - BuyAndHoldSPY

simulation:
  start_date: 2018-01-01
  end_date: null          # null = use latest date available in the cache
  starting_capital: 10000
  cash_annualized_rate: 0.04
  slippage_bps: 5

output:
  directory: ./backtests/momentum_2018_baseline/
  format: html

cache_db: data/backtest_cache.db
