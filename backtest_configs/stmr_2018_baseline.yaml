# ShortTermMeanReversion baseline backtest — 2018-01-01 to latest cached date.
#
# Run this configuration exactly once before any parameter tuning.
#
# Usage:
#   bot-ctl backtest refresh-data --all   # populate cache (88 symbols; overlap with STMR universe)
#   bot-ctl backtest run backtest_configs/stmr_2018_baseline.yaml

strategy:
  class: ShortTermMeanReversion
  parameters:
    lookback_days: 210
    entry_rsi_threshold: 10
    exit_rsi_threshold: 70
    hard_stop_pct: 0.08
    time_stop_days: 15
    risk_per_trade_pct: 0.01
    max_position_pct: 0.20
    max_concurrent_positions: 8
    max_total_deployment_pct: 1.00
    drawdown_circuit_breaker_pct: 0.15

benchmarks:
  - BuyAndHoldSPY

simulation:
  start_date: "2018-01-01"
  end_date: null          # null = use latest date available in the cache
  starting_capital: 10000
  cash_annualized_rate: 0.04
  slippage_bps: 5

output:
  directory: ./backtests/stmr_2018_baseline/
  format: html

cache_db: data/backtest_cache.db
